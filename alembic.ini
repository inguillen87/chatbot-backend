# A generic, single database configuration.

[alembic]
# Dónde están los scripts de migración
script_location = migrations

# OJO: Alembic usará SIEMPRE la URL que setea migrations/env.py
# (desde -x dburl=..., app.config o variables de entorno).
# Si querés, podés dejar una URL de respaldo acá, pero NO es necesario.
# sqlalchemy.url = postgresql+psycopg://user:pass@host:5432/db?sslmode=require

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
