services:
  # 1. El Servidor Web Principal (Flask)
  - type: web
    name: chatboc-backend
    runtime: python
    # SECURITY OPERATIONS: api.chatboc.ar is already attached to this existing
    # service outside the Blueprint. Keep its onrender.com subdomain disabled
    # in Render Dashboard; redeclaring the domain here fails Blueprint validation.
    # Keep Render's automatic probe on liveness until managed Postgres + Redis
    # pass /health/ready in staging. The controlled cutover is documented in
    # docs/render.deploy.quickcheck.md; changing this early blocks every deploy.
    healthCheckPath: /health
    buildCommand: "./build.sh"
    preDeployCommand: "python -m scripts.run_predeploy_migrations"
    startCommand: "gunicorn --config gunicorn.conf.py --bind 0.0.0.0:$PORT app:app"
    plan: starter
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: app.py
      - key: ENV
        value: production
      - key: FLASK_ENV
        value: production
      # Shared maintenance-window fence. It is inert by default and is
      # propagated to every background writer below from this web service.
      - key: CUTOVER_WRITER_FENCE_ENABLED
        value: "false"
      # Persistent cross-runtime authority remains inert until the approved
      # cutover window. Runtime identity is declarative; the dedicated shared
      # PostgreSQL control DSN never falls back to DATABASE_URL. If the flag is
      # enabled before the DSN is loaded, every guarded writer fails closed.
      - key: CUTOVER_RUNTIME_IDENTITY
        value: render
      - key: CUTOVER_GLOBAL_WRITER_AUTHORITY_ENABLED
        value: "false"
      - key: CUTOVER_GLOBAL_WRITER_AUTHORITY_DATABASE_URL
        sync: false
      # These secrets must be loaded manually on the existing Render service.
      # Standby mode stays false until the final writer freeze is certified.
      - key: DATABASE_URL
        sync: false
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      # Required only when standby mode is enabled. The pre-deploy hook checks
      # both identifiers inside a read-only transaction before Render starts.
      - key: EXPECTED_NEON_PROJECT_ID
        sync: false
      - key: EXPECTED_NEON_BRANCH_ID
        sync: false
      - key: CHATBOC_RENDER_STANDBY_MODE
        value: "false"
      - key: CHATBOC_RENDER_STANDBY_SCHEMA_ACTION
        value: "verify-only"
      # Keep false until the R2 put/get/delete probe and remaining /data users
      # are certified. The flag is intentionally explicit, never implicit.
      - key: VERCEL_DURABLE_UPLOADS_REQUIRE_R2
        value: "false"
      - key: BACKEND_URL
        value: https://api.chatboc.ar
      - key: PUBLIC_API_BASE_URL
        value: https://api.chatboc.ar
      # Shared by Flow issuance, Data Exchange and completion webhooks.
      - key: WHATSAPP_FLOW_TOKEN_KEY_V1
        sync: false
      - key: WHATSAPP_FLOW_TOKEN_TTL_SECONDS
        value: "172800"
      - key: META_FLOW_DATA_EXCHANGE_MAX_PAYLOAD_BYTES
        value: "65536"
      # Per-WABA private keys and app secrets must be added in Render only
      # after the real WABA is known. Do not declare placeholder WABA IDs.
      - key: PANEL_URL
        value: https://www.chatboc.ar
      - key: WIDGET_URL
        value: https://www.chatboc.ar
      - key: PUBLIC_ROOT_DOMAIN
        value: chatboc.ar
      - key: CORS_ALLOWED_ORIGINS
        value: "https://chatboc.ar,https://www.chatboc.ar"
      - key: CORS_ALLOW_LOCAL_DEV
        value: "false"
      - key: LLM_PROVIDER_ORDER
        value: openai,gemini
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL_DEFAULT
        value: gpt-5.6-sol
      - key: OPENAI_CHAT_MODEL_WHATSAPP
        value: gpt-5.6-sol
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: glm-5.2:cloud
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "45"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CLERK_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://chatboc.ar,https://www.chatboc.ar
      - key: CLERK_REQUIRE_AZP
        value: "true"
      - key: CHATBOC_TERMS_VERSION
        value: "2026-07-11"
      - key: CLERK_SOCIAL_PROVIDERS
        sync: false
      - key: CLERK_SUPERADMIN_EMAILS
        sync: false
      - key: LIVE_CHAT_ROOM_TOKEN_TTL_SECONDS
        value: "900"
      - key: TRACKING_FAILURE_RATE_LIMIT_ATTEMPTS
        value: "5"
      - key: TRACKING_SUBJECT_FAILURE_RATE_LIMIT_ATTEMPTS
        value: "20"
      - key: TRACKING_FAILURE_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Deployment gate: the public full demo catalog uses client and global
      # counters that must be shared before the Render web service can start.
      # Set a managed Redis/Redis-TLS URL; memory:// is rejected on Render web.
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "2"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "2"
      - key: READINESS_DATABASE_TIMEOUT_SECONDS
        value: "1.5"
      - key: READINESS_REDIS_TIMEOUT_SECONDS
        value: "1.0"
      - key: READINESS_CACHE_TTL_SECONDS
        value: "1.0"
      - key: DEMO_CATALOG_FULL_RATE_LIMIT
        value: "12 per minute"
      - key: DEMO_CATALOG_FULL_GLOBAL_RATE_LIMIT
        value: "48 per minute"
      - key: AUTH_EMAIL_VERIFY_BASE_URL
        value: https://www.chatboc.ar
      - key: AUTH_EMAIL_FROM
        value: info@chatboc.ar
      - key: ZOHO_SMTP_HOST
        value: smtp.zoho.com
      - key: ZOHO_SMTP_PORT
        value: "587"
      - key: ZOHO_SMTP_USER
        sync: false
      - key: ZOHO_SMTP_PASSWORD
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      # Durable inbound WhatsApp infrastructure is deployed in fail-closed
      # standby below. The public webhook stays synchronous until this mode and
      # a non-empty tenant allowlist are changed together after staging proof.
      - key: WHATSAPP_INBOUND_DURABILITY_MODE
        value: legacy
      - key: WHATSAPP_INBOUND_QUEUE_TENANT_IDS
        value: ""
      - key: WHATSAPP_INBOUND_HASH_SECRET
        sync: false
      - key: WHATSAPP_INBOUND_MAX_PAYLOAD_BYTES
        value: "65536"
      - key: WHATSAPP_INBOUND_LEASE_SECONDS
        value: "180"
      - key: WHATSAPP_INBOUND_MAX_ATTEMPTS
        value: "8"
      - key: WHATSAPP_INBOUND_WORKER_BATCH_SIZE
        value: "8"
      - key: WHATSAPP_INBOUND_WORKER_POLL_SECONDS
        value: "0.5"
      - key: WHATSAPP_MEDIA_DOWNLOAD_TIMEOUT_SECONDS
        value: "12"
      - key: WHATSAPP_MEDIA_MAX_BYTES
        value: "26214400"
      - key: WHATSAPP_INBOUND_CELERY_WAKEUP_ENABLED
        value: "false"
      # Retention has its own durable tenant scope. Keep former canaries here
      # after rollback/removal so their terminal payloads do not become orphaned.
      # Both switches below must be deliberately inverted before any scrub.
      - key: WHATSAPP_INBOUND_PAYLOAD_SCRUB_TENANT_IDS
        value: ""
      - key: WHATSAPP_INBOUND_PAYLOAD_SCRUB_ENABLED
        value: "false"
      - key: WHATSAPP_INBOUND_PAYLOAD_LEGAL_HOLD
        value: "true"
      - key: WHATSAPP_INBOUND_DEAD_PAYLOAD_RETENTION_HOURS
        value: "72"
      - key: WHATSAPP_INBOUND_PAYLOAD_SCRUB_BATCH_SIZE
        value: "200"
      # Durable Notification -> Twilio transport remains canary-only. Enabling
      # the boolean without an explicit tenant allowlist still fails closed.
      - key: WHATSAPP_NOTIFICATION_TRANSPORT_ENABLED
        value: "false"
      - key: WHATSAPP_NOTIFICATION_TRANSPORT_TENANT_IDS
        value: ""
      - key: NOTIFICATION_DISPATCH_LEASE_SECONDS
        value: "180"
      - key: SMTP_REQUIRE_AUTH
        value: "true"
      # Governance-sensitive core remains off until migration + scoped staging.
      - key: ENABLE_ASSESSMENT_INTERVIEWS_V1
        value: "false"
      - key: ENABLE_INTERVIEW_ASSIGNMENTS_V1
        value: "false"
      # Fail-closed rollout: keep legacy sends until the migration, worker and
      # a tenant-scoped provider smoke test are all verified in Render.
      - key: DOMAIN_EFFECT_OUTBOX_MODE
        value: legacy
      - key: DOMAIN_EFFECT_OUTBOX_SECRET
        sync: false
      - key: DOMAIN_EFFECT_OUTBOX_TENANT_IDS
        value: ""
      - key: DOMAIN_EFFECT_OUTBOX_MAX_PAYLOAD_BYTES
        value: "4096"
      - key: DOMAIN_EFFECT_OUTBOX_LEASE_SECONDS
        value: "180"
      - key: DOMAIN_EFFECT_OUTBOX_MAX_ATTEMPTS
        value: "8"
      - key: DOMAIN_EFFECT_OUTBOX_WORKER_BATCH_SIZE
        value: "20"
      - key: DOMAIN_EFFECT_OUTBOX_WORKER_POLL_SECONDS
        value: "0.5"
      - key: DOMAIN_EFFECT_OUTBOX_CELERY_WAKEUP_ENABLED
        value: "false"
      - key: SURVEY_RESPONSE_EFFECT_LEASE_SECONDS
        value: "120"
      - key: SURVEY_RESPONSE_EFFECT_WORKER_BATCH_SIZE
        value: "50"
      - key: SURVEY_RESPONSE_EFFECT_WORKER_MAX_TENANTS_PER_CYCLE
        value: "50"
      - key: SURVEY_RESPONSE_EFFECT_WORKER_POLL_SECONDS
        value: "0.5"
      - key: SURVEY_IDENTITY_HMAC_SECRET_V1
        sync: false
      - key: ENABLE_SURVEY_SYNTHETIC_SEEDING_V1
        value: "false"
      - key: SURVEY_SYNTHETIC_SEED_TENANT_IDS
        value: ""
      # Institutional survey truth boundary. Keep fail-safe defaults in IaC;
      # enforcement is enabled only through an explicit tenant canary rollout.
      - key: SURVEY_JURISDICTION_GATE_MODE
        value: observe
      - key: SURVEY_JURISDICTION_GATE_TENANT_IDS
        value: ""
      - key: ENABLE_SURVEY_ELIGIBILITY_GRANTS_V1
        value: "false"
      - key: SURVEY_ELIGIBILITY_GRANT_TENANT_IDS
        value: ""
      - key: SURVEY_ELIGIBILITY_SECRET_V1
        sync: false
      - key: ENABLE_WHATSAPP_WORKFLOW_STUDIO_DURABLE_V1
        value: "false"
      - key: WHATSAPP_WORKFLOW_STUDIO_DURABLE_TENANT_IDS
        value: ""
      # Canonical channel sessions are tenant-scoped and contain no raw phone
      # number in their binding or primary key. Shadow is the migration phase;
      # switch to enforce before enabling durable WhatsApp or realtime voice.
      - key: CHANNEL_SESSION_IDENTITY_MODE
        value: shadow
      - key: CHANNEL_SESSION_IDENTITY_HMAC_SECRET_V1
        sync: false
      - key: CHANNEL_SESSION_IDENTITY_VERSION_V1
        value: v1
      # Generic catch-all remains disabled. Enable this only for
      # ProviderConnection-bound adapters that implement omnichannel.inbound.v1
      # and hold their own derived signing key.
      - key: OMNICHANNEL_SIGNED_INBOUND_MODE
        value: disabled
      - key: OMNICHANNEL_INBOUND_HMAC_SECRET_V1
        sync: false
      - key: OMNICHANNEL_INBOUND_MAX_PAYLOAD_BYTES
        value: "65536"
      - key: OMNICHANNEL_INBOUND_MAX_CLOCK_SKEW_SECONDS
        value: "300"
      # Shared Socket.IO pub/sub for events emitted outside the web process.
      # Configure one Redis/Redis-TLS URL in the web service; the survey worker
      # receives that exact secret and channel through fromService below.
      - key: SOCKETIO_MESSAGE_QUEUE_URL
        sync: false
      - key: SOCKETIO_MESSAGE_QUEUE_CHANNEL
        value: chatboc-realtime-v1
      - key: SOCKETIO_MESSAGE_QUEUE_HEALTHCHECK_TIMEOUT_SECONDS
        value: "2"
      - key: SIGEM_LIVE_ENABLED
        value: "false"
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: HUGGINGFACE_ENABLED
        value: "true"
      - key: HUGGINGFACE_PROVIDER
        value: auto
      - key: HUGGINGFACE_EMBEDDINGS_ENABLED
        value: "false"
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: intfloat/multilingual-e5-large
      - key: HUGGINGFACE_ZERO_SHOT_ENABLED
        value: "true"
      - key: HUGGINGFACE_ZERO_SHOT_MODEL
        value: joeddav/xlm-roberta-large-xnli
      - key: HUGGINGFACE_RECLAMO_CATEGORY_MIN_SCORE
        value: "0.72"
      - key: HUGGINGFACE_RECLAMO_PRIORITY_MIN_SCORE
        value: "0.66"
      - key: HUGGINGFACE_RECLAMO_SIGNAL_MIN_SCORE
        value: "0.62"
      - key: HUGGINGFACE_SENTIMENT_MIN_SCORE
        value: "0.56"
      - key: HUGGINGFACE_PYME_INTENT_MIN_SCORE
        value: "0.62"
      - key: VISION_HUGGINGFACE_ENABLED
        value: "false"
      - key: HUGGINGFACE_IMAGE_CLASSIFICATION_MODEL
        value: google/vit-base-patch16-224
      - key: HUGGINGFACE_OBJECT_DETECTION_MODEL
        value: facebook/detr-resnet-50
      - key: INSTALL_OPEN_SOURCE_AI_EXTRAS
        value: "false"
      - key: DOCLING_ENABLED
        value: "false"
      - key: DOCLING_MAX_FILE_MB
        value: "15"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: VOICE_STREAM_SIGNING_SECRET
        sync: false
      - key: VOICE_STREAM_ENVELOPE_TTL_SECONDS
        value: "120"
      - key: VOICE_STREAM_PREFLIGHT_TIMEOUT_SECONDS
        value: "5"
      - key: VOICE_STREAM_PREFLIGHT_MAX_EVENTS
        value: "3"
      - key: VOICE_STREAM_PREFLIGHT_MAX_MESSAGE_BYTES
        value: "32768"
      - key: ENABLE_VOICE_CONSENT_LIFECYCLE_V1
        value: "false"
      # One-time replay consumption reuses SOCKETIO_MESSAGE_QUEUE_URL above.
      # VOICE_STREAM_REPLAY_REDIS_URL may override it manually when isolation
      # in a dedicated Redis database is required.
      - key: TWILIO_FALLBACK_VOICE
        value: Polly.Lupe-Neural
      - key: TWILIO_FALLBACK_SAY_LANGUAGE
        value: es-US
      - key: TWILIO_GATHER_LANGUAGE
        value: es-AR
      - key: TTS_CACHE_ENABLED
        value: "true"
      - key: WHATSAPP_MENU_AUDIO_ENABLED
        value: "true"
      - key: TTS_AUDIO_CACHE_PUBLIC_BASE_URL
        sync: false
      - key: CLOUDFLARE_AUDIO_CACHE_PUBLIC_BASE_URL
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_ENFORCE_PUBLIC_INTAKE
        value: "false"
      - key: TWILIO_META_APP_ID
        sync: false
      - key: TWILIO_META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: TWILIO_PARTNER_SOLUTION_ID
        sync: false
      - key: TWILIO_TECH_PROVIDER_LIVE_ENABLED
        value: "false"
      - key: TWILIO_TENANT_AUTO_BOOTSTRAP_ENABLED
        value: "true"
      - key: TWILIO_TENANT_AUTO_PROVISION_ENABLED
        value: "false"
      - key: TWILIO_SUBACCOUNT_AUTH_TOKEN
        sync: false
      - key: RENDER_ENV_SYNC_ENABLED
        value: "false"
      - key: RENDER_ENV_SYNC_TRIGGER_DEPLOY_ENABLED
        value: "false"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_ENV_GROUP_ID
        sync: false

  # 2. El Cron Job (Automatización Semanal)
  # Durable WhatsApp poller. In the Blueprint default it exits application
  # bootstrap before DB/queue/provider access and blocks on one signal-aware
  # Event.wait(). Queue activation still requires the web mode, tenant allowlist,
  # stream secret and canonical identity contract to pass validation together.
  - type: worker
    name: chatboc-whatsapp-durable
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m services.whatsapp_inbound_worker --standby-when-legacy"
    plan: starter
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: app.py
      - key: ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: CHATBOC_PROCESS_ROLE
        value: whatsapp-durable-worker
      - key: CUTOVER_WRITER_FENCE_ENABLED
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CUTOVER_WRITER_FENCE_ENABLED
      - key: CUTOVER_RUNTIME_IDENTITY
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CUTOVER_RUNTIME_IDENTITY
      - key: CUTOVER_GLOBAL_WRITER_AUTHORITY_ENABLED
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CUTOVER_GLOBAL_WRITER_AUTHORITY_ENABLED
      - key: CUTOVER_GLOBAL_WRITER_AUTHORITY_DATABASE_URL
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CUTOVER_GLOBAL_WRITER_AUTHORITY_DATABASE_URL
      - key: CHATBOC_RENDER_STANDBY_MODE
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CHATBOC_RENDER_STANDBY_MODE
      - key: VERCEL_DURABLE_UPLOADS_REQUIRE_R2
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: VERCEL_DURABLE_UPLOADS_REQUIRE_R2
      - key: WHATSAPP_DURABLE_WORKER_STANDBY_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: SECRET_KEY
      - key: BACKEND_URL
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: BACKEND_URL
      - key: WHATSAPP_INBOUND_DURABILITY_MODE
        # Independent from web: activate worker first and keep it draining
        # after web rollback. Blueprint reapplies the safe standby default.
        value: legacy
      - key: WHATSAPP_INBOUND_QUEUE_TENANT_IDS
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_QUEUE_TENANT_IDS
      - key: WHATSAPP_INBOUND_HASH_SECRET
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_HASH_SECRET
      - key: WHATSAPP_INBOUND_MAX_PAYLOAD_BYTES
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_MAX_PAYLOAD_BYTES
      - key: WHATSAPP_INBOUND_LEASE_SECONDS
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_LEASE_SECONDS
      - key: WHATSAPP_INBOUND_MAX_ATTEMPTS
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_MAX_ATTEMPTS
      - key: WHATSAPP_INBOUND_WORKER_BATCH_SIZE
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_WORKER_BATCH_SIZE
      - key: WHATSAPP_INBOUND_WORKER_POLL_SECONDS
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_INBOUND_WORKER_POLL_SECONDS
      - key: WHATSAPP_MEDIA_DOWNLOAD_TIMEOUT_SECONDS
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_MEDIA_DOWNLOAD_TIMEOUT_SECONDS
      - key: WHATSAPP_MEDIA_MAX_BYTES
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: WHATSAPP_MEDIA_MAX_BYTES
      - key: WHATSAPP_INBOUND_CELERY_WAKEUP_ENABLED
        value: "false"
      - key: CHANNEL_SESSION_IDENTITY_MODE
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CHANNEL_SESSION_IDENTITY_MODE
      - key: CHANNEL_SESSION_IDENTITY_HMAC_SECRET_V1
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CHANNEL_SESSION_IDENTITY_HMAC_SECRET_V1
      - key: CHANNEL_SESSION_IDENTITY_VERSION_V1
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: CHANNEL_SESSION_IDENTITY_VERSION_V1
      - key: SOCKETIO_MESSAGE_QUEUE_URL
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: SOCKETIO_MESSAGE_QUEUE_URL
      - key: SOCKETIO_MESSAGE_QUEUE_CHANNEL
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: SOCKETIO_MESSAGE_QUEUE_CHANNEL
      - key: SOCKETIO_MESSAGE_QUEUE_HEALTHCHECK_TIMEOUT_SECONDS
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: SOCKETIO_MESSAGE_QUEUE_HEALTHCHECK_TIMEOUT_SECONDS
      - key: LLM_PROVIDER_ORDER
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: LLM_PROVIDER_ORDER
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_CHAT_MODEL_DEFAULT
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: OPENAI_CHAT_MODEL_DEFAULT
      - key: OPENAI_CHAT_MODEL_WHATSAPP
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: OPENAI_CHAT_MODEL_WHATSAPP
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_CHAT_MODEL
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: GEMINI_CHAT_MODEL
      - key: OLLAMA_ENABLED
        fromService:
          type: web
          name: chatboc-backend
          envVarKey: OLLAMA_ENABLED
