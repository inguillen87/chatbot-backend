services:
  # 1. El Servidor Web Principal (Flask)
  - type: web
    name: chatboc-backend
    env: python
    buildCommand: "./build.sh"
    preDeployCommand: "flask db upgrade"
    startCommand: "gunicorn --worker-class eventlet --workers 1 --bind 0.0.0.0:$PORT app:app"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: app.py
      - key: BACKEND_URL
        value: https://api.chatboc.ar
      - key: PUBLIC_API_BASE_URL
        value: https://api.chatboc.ar
      - key: LLM_PROVIDER_ORDER
        value: openai,gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: glm-5.2:cloud
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "45"
      - key: CLERK_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_SOCIAL_PROVIDERS
        value: google,facebook,linkedin
      - key: AUTH_EMAIL_VERIFY_BASE_URL
        value: https://www.chatboc.ar
      - key: AUTH_EMAIL_FROM
        value: info@chatboc.ar
      - key: ZOHO_SMTP_HOST
        value: smtp.zoho.com
      - key: ZOHO_SMTP_PORT
        value: "587"
      - key: ZOHO_SMTP_USER
        sync: false
      - key: ZOHO_SMTP_PASSWORD
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: HUGGINGFACE_ENABLED
        value: "true"
      - key: HUGGINGFACE_PROVIDER
        value: auto
      - key: HUGGINGFACE_EMBEDDINGS_ENABLED
        value: "false"
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: intfloat/multilingual-e5-large
      - key: HUGGINGFACE_ZERO_SHOT_ENABLED
        value: "true"
      - key: HUGGINGFACE_ZERO_SHOT_MODEL
        value: joeddav/xlm-roberta-large-xnli
      - key: HUGGINGFACE_RECLAMO_CATEGORY_MIN_SCORE
        value: "0.72"
      - key: HUGGINGFACE_RECLAMO_PRIORITY_MIN_SCORE
        value: "0.66"
      - key: HUGGINGFACE_RECLAMO_SIGNAL_MIN_SCORE
        value: "0.62"
      - key: HUGGINGFACE_SENTIMENT_MIN_SCORE
        value: "0.56"
      - key: HUGGINGFACE_PYME_INTENT_MIN_SCORE
        value: "0.62"
      - key: VISION_HUGGINGFACE_ENABLED
        value: "false"
      - key: HUGGINGFACE_IMAGE_CLASSIFICATION_MODEL
        value: google/vit-base-patch16-224
      - key: HUGGINGFACE_OBJECT_DETECTION_MODEL
        value: facebook/detr-resnet-50
      - key: INSTALL_OPEN_SOURCE_AI_EXTRAS
        value: "false"
      - key: DOCLING_ENABLED
        value: "false"
      - key: DOCLING_MAX_FILE_MB
        value: "15"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FALLBACK_VOICE
        value: Polly.Lupe-Neural
      - key: TWILIO_FALLBACK_SAY_LANGUAGE
        value: es-US
      - key: TWILIO_GATHER_LANGUAGE
        value: es-AR
      - key: TWILIO_META_APP_ID
        sync: false
      - key: TWILIO_META_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: TWILIO_PARTNER_SOLUTION_ID
        sync: false
      - key: TWILIO_TECH_PROVIDER_LIVE_ENABLED
        value: "false"
      - key: TWILIO_TENANT_AUTO_BOOTSTRAP_ENABLED
        value: "true"
      - key: TWILIO_TENANT_AUTO_PROVISION_ENABLED
        value: "false"
      - key: TWILIO_SUBACCOUNT_AUTH_TOKEN
        sync: false
      - key: RENDER_ENV_SYNC_ENABLED
        value: "false"
      - key: RENDER_ENV_SYNC_TRIGGER_DEPLOY_ENABLED
        value: "false"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: RENDER_ENV_GROUP_ID
        sync: false

  # 2. El Cron Job (Automatización Semanal)
  - type: cron
    name: weekly-analytics-report
    env: python
    schedule: "0 0 * * 0" # Se ejecuta todos los domingos a las 00:00 UTC
    buildCommand: "./build.sh" # Usa las mismas dependencias
    startCommand: "flask generate-weekly-reports" # El comando que creamos en cli_commands.py
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: app.py
      - key: LLM_PROVIDER_ORDER
        value: openai,gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: OLLAMA_ENABLED
        value: "false"
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: glm-5.2:cloud
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "45"
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: HUGGINGFACE_ENABLED
        value: "true"
      - key: HUGGINGFACE_PROVIDER
        value: auto
      - key: HUGGINGFACE_EMBEDDINGS_ENABLED
        value: "false"
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: intfloat/multilingual-e5-large
      - key: HUGGINGFACE_ZERO_SHOT_ENABLED
        value: "true"
      - key: HUGGINGFACE_ZERO_SHOT_MODEL
        value: joeddav/xlm-roberta-large-xnli
      - key: HUGGINGFACE_RECLAMO_CATEGORY_MIN_SCORE
        value: "0.72"
      - key: HUGGINGFACE_RECLAMO_PRIORITY_MIN_SCORE
        value: "0.66"
      - key: HUGGINGFACE_RECLAMO_SIGNAL_MIN_SCORE
        value: "0.62"
      - key: HUGGINGFACE_SENTIMENT_MIN_SCORE
        value: "0.56"
      - key: HUGGINGFACE_PYME_INTENT_MIN_SCORE
        value: "0.62"
      - key: INSTALL_OPEN_SOURCE_AI_EXTRAS
        value: "false"
      - key: DOCLING_ENABLED
        value: "false"
      - key: DOCLING_MAX_FILE_MB
        value: "15"
