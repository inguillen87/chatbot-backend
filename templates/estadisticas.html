<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas y Mapas de Calor</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://unpkg.com/@maptiler/geocoding-control@1.0.5/dist/style.css" rel="stylesheet" />
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Estadísticas y Mapas de Calor</h1>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maptiler/geocoding-control@1.0.5/dist/maptiler-geocoding-control.umd.min.js"></script>
    <script>
        const apiKey = '{{ maptiler_key }}';
        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${apiKey}`,
            center: [-68.845, -32.889],
            zoom: 12
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maptiler.GeocodingControl({
            apiKey,
            language: 'es',
            country: 'ar',
            placeholder: 'Buscar dirección o lugar…',
            addMarker: true,
            keepOpen: false,
        }), 'top-left');

        map.on('load', () => {
            map.addSource('puntos', {
                type: 'geojson',
                data: '/estadisticas/locations',
            });

            map.addLayer({
                id: 'heat',
                type: 'heatmap',
                source: 'puntos',
                maxzoom: 16,
                paint: {
                    'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 0, 1, 16, 3],
                    'heatmap-weight': ['interpolate', ['linear'], ['get', 'weight'], 0, 0, 10, 1],
                    'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 0, 2, 16, 35],
                    'heatmap-opacity': 0.8,
                },
            });
        });
    </script>
</body>
</html>
