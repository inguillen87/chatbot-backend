<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat Demo</title>
  <link rel="stylesheet" href="../chat.css">
  <style>
    body { font-family: sans-serif; margin: 0; background: #111827; }
    #messages { max-width: 640px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { display: flex; }
    .msg.bot { justify-content: flex-start; }
    .msg.user { justify-content: flex-end; }
    .msg-inner { border-radius: 1rem; padding: 0.5rem 1rem; max-width: 85vw; }
    .bot .msg-inner { background:#131c2b; color:#fff; border:1px solid #195fa4; }
    .user .msg-inner { background:linear-gradient(to bottom right,#2563eb,#1e40af); color:#fff; }
    #input { display:flex; gap:0.5rem; max-width:640px; margin:1rem auto; }
    #input textarea { flex:1; resize:none; padding:0.5rem; border-radius:0.5rem; }
  </style>
</head>
<body>
  <div id="messages"></div>
  <div id="input">
    <textarea id="text" rows="2" placeholder="Escribe un mensaje..."></textarea>
    <button id="send">Enviar</button>
  </div>
  <script>
    const messagesEl = document.getElementById('messages');
    const textEl = document.getElementById('text');
    document.getElementById('send').addEventListener('click', sendMessage);
    textEl.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    function addMessage(text, isBot) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + (isBot ? 'bot' : 'user');
      const inner = document.createElement('div');
      inner.className = 'msg-inner';
      inner.innerHTML = text;
      wrapper.appendChild(inner);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping(isUser) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + (isUser ? 'user' : 'bot');
      wrapper.id = 'typing-indicator';
      const inner = document.createElement('div');
      inner.className = 'msg-inner';
      inner.innerHTML = `
        <img src="../images/user-avatar.svg" class="w-6 h-6 user-avatar" alt="Cliente">
        <span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>`;
      wrapper.appendChild(inner);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function sendMessage() {
      const text = textEl.value.trim();
      if (!text) return;
      addMessage(text, false);
      textEl.value = '';
      showTyping(true);
      // Aquí se llamaría al backend; por ahora se responde eco
      setTimeout(() => {
        hideTyping();
        addMessage('Echo: ' + text, true);
      }, 500);
    }
  </script>
</body>
</html>
