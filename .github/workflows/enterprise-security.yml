name: Enterprise security regression
"on":
  pull_request:
    paths:
      - routes/auth.py
      - routes/mercadopago_webhook.py
      - utils/widget_jwks.py
      - utils/commerce_realtime.py
      - tests/test_enterprise_security_sprint0.py
      - .github/workflows/enterprise-security.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focal production dependency versions
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          Flask==3.1.1 Flask-SocketIO==5.5.1 PyJWT==2.10.1
          cryptography==45.0.5 python-socketio==5.16.4 python-engineio==4.13.2
      - name: Public key, HTTP handler and isolated transport regressions
        run: python -m unittest tests.test_enterprise_security_sprint0 -v
      - name: Compile changed production modules
        run: python -m py_compile routes/auth.py routes/mercadopago_webhook.py utils/widget_jwks.py utils/commerce_realtime.py
