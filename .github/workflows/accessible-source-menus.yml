name: Accessible source menus
"on":
  pull_request:
    paths:
      - data/conversation_guides/**
      - services/accessible_support_guide.py
      - tests/test_accessible_support_guide.py
      - .github/workflows/accessible-source-menus.yml
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - run: python -m unittest tests.test_accessible_support_guide -v
