name: Government support preset
"on":
  pull_request:
    paths:
      - data/tenant_blueprints/**
      - services/tenant_blueprints.py
      - utils/roles.py
      - tests/test_government_support_preset.py
      - .github/workflows/government-support-preset.yml
permissions:
  contents: read
concurrency:
  group: government-support-preset-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
      - name: Install focal contract dependency
        run: python -m pip install SQLAlchemy==2.0.41 typing_extensions==4.14.0 greenlet==3.2.3
      - name: Validate preset and side-effect-free projection
        run: python -m unittest tests.test_government_support_preset -v
