name: Verify release security reconciliation object
"on":
  push:
    branches: [release/chatboc-production-20260922]
    paths: [.github/workflows/release-security-object.yml]
permissions:
  contents: read
concurrency:
  group: release-security-object-20260922
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'inguillen87/chatbot-backend' && github.ref == 'refs/heads/release/chatboc-production-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6f4c911db4749319baeb4711aff2045735cec0f0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Fetch the exact already reviewed public main commit
        run: git fetch --no-tags --depth=1 origin efbf809db12dbdb123a6eeb3d40ae0a2f1af5e55
      - name: Prepare only the two conflicting JWKS functions and reviewed dependencies
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import textwrap

          base = '6f4c911db4749319baeb4711aff2045735cec0f0'
          main = 'efbf809db12dbdb123a6eeb3d40ae0a2f1af5e55'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          path = Path('routes/auth.py')
          original = path.read_bytes()
          assert blob(original) == 'ff7de3a1823c2ed8c6d67de86f44e8470388384a'
          before = ast.parse(original.decode('utf-8'))
          replacements = {
              '_widget_jwks_payload': textwrap.dedent('''\
                  def _widget_jwks_payload() -> dict[str, list[dict[str, str]]]:
                      """Publish verification keys only, never shared signing material."""
                      from utils.widget_jwks import build_public_widget_jwks

                      return build_public_widget_jwks(current_app.config)
                  '''),
              'widget_jwks': textwrap.dedent('''\
                  def widget_jwks():
                      payload = _widget_jwks_payload()
                      resp = jsonify(payload)
                      resp.headers["Cache-Control"] = "no-store, max-age=0"
                      resp.headers["Pragma"] = "no-cache"
                      return resp
                  '''),
          }
          targets = [n for n in before.body if isinstance(n, ast.FunctionDef) and n.name in replacements]
          assert {n.name for n in targets} == set(replacements) and len(targets) == 2
          lines = original.decode('utf-8').splitlines(keepends=True)
          for node in sorted(targets, key=lambda n: n.lineno, reverse=True):
              lines[node.lineno - 1:node.end_lineno] = [replacements[node.name]]
          proposed = ''.join(lines).encode('utf-8')
          after = ast.parse(proposed.decode('utf-8'))
          def unaffected(tree):
              return [ast.dump(n, include_attributes=False) for n in tree.body
                      if not (isinstance(n, ast.FunctionDef) and n.name in replacements)]
          assert unaffected(before) == unaffected(after), 'Unrelated authentication code changed'
          for old in targets:
              new = next(n for n in after.body if isinstance(n, ast.FunctionDef) and n.name == old.name)
              assert [ast.dump(d) for d in old.decorator_list] == [ast.dump(d) for d in new.decorator_list]
          path.write_bytes(proposed)
          main_files = {
              'utils/widget_jwks.py': 'aac7b82a7e8b0dc34379b73ff7693b950f38e6e1',
              'utils/commerce_realtime.py': 'ee25f27c760dc74f3b2df86a2b3071d6fee1dc65',
              'routes/mercadopago_webhook.py': 'b2da60cc0277a460b664c0ed963d39c2f5054fed',
              'tests/test_enterprise_security_sprint0.py': 'bd8ae6c25abab38f25868b4cc7e6d4008f93ae57',
          }
          assert blob(Path('routes/mercadopago_webhook.py').read_bytes()) == 'a5f1aea0017f9c81de1c4b34fd6355576c048b17'
          for name, expected in main_files.items():
              data = subprocess.check_output(['git', 'show', main + ':' + name])
              assert blob(data) == expected
              destination = Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          evidence = Path('test-evidence/release-reconcile')
          evidence.mkdir(parents=True, exist_ok=True)
          receipt = {'base': base, 'main': main, 'source_blob': blob(original),
              'proposed_blob': blob(proposed), 'proposed_sha256': hashlib.sha256(proposed).hexdigest(),
              'only_two_auth_functions_changed': True, 'route_decorators_preserved': True,
              'branch_or_alias_updated': False, 'production_tested': False}
          (evidence / 'prepared.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - name: Install the existing focal security test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          Flask==3.1.1 Flask-SocketIO==5.5.1 PyJWT==2.10.1
          cryptography==50.0.0 python-socketio==5.16.4 python-engineio==4.13.2
      - name: Test the proposed real functions before creating a git blob
        run: |
          python -m unittest tests.test_enterprise_security_sprint0 -v
          python -m py_compile routes/auth.py routes/mercadopago_webhook.py utils/widget_jwks.py utils/commerce_realtime.py
      - name: Store verified object only, never update a branch or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          evidence = Path('test-evidence/release-reconcile')
          receipt = json.loads((evidence / 'prepared.json').read_text())
          data = Path('routes/auth.py').read_bytes()
          expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert expected == receipt['proposed_blob']
          assert hashlib.sha256(data).hexdigest() == receipt['proposed_sha256']
          payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')}).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/inguillen87/chatbot-backend/git/blobs',
              data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 201
              result = json.load(response)
          assert result['sha'] == expected
          receipt.update({'github_blob': result['sha'], 'focused_tests_passed': True})
          (evidence / 'verified-object.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-security-object
          path: test-evidence/release-reconcile/
          if-no-files-found: error
          retention-days: 3
