name: Survey deletion policy and full-app HTTP
"on":
  pull_request:
    paths:
      - routes/encuestas_admin.py
      - services/survey_deletion_policy.py
      - tests/test_survey_deletion_policy.py
      - tests/survey_workspace_http_acceptance.py
      - tests/run_survey_workspace_browser.py
      - tests/survey-workspace.browser.mjs
      - .github/workflows/survey-deletion-policy.yml
permissions:
  contents: read
concurrency:
  group: survey-deletion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: inguillen87/chatboc-frontend
          ref: d88730d93593305c1fb26d5aa7e37f2af30054bc
          path: frontend
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - working-directory: backend
        run: python -m unittest tests.test_survey_deletion_policy -v
      - working-directory: backend
        run: python -m tests.survey_workspace_http_acceptance
      - working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install chromium
      - working-directory: backend
        run: python -m tests.run_survey_workspace_browser --frontend ../frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: survey-workspace-acceptance
          path: frontend/test-evidence/survey-workspace/
          if-no-files-found: ignore
          retention-days: 3
