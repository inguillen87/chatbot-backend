name: Public runtime recovery configuration
"on":
  pull_request:
    paths:
      - routes/config.py
      - middleware/tenant_context.py
      - config/runtime_recovery_ui.json
      - tests/test_runtime_recovery_config.py
      - tests/test_runtime_recovery_middleware.py
      - .github/workflows/runtime-recovery-copy.yml
permissions:
  contents: read
concurrency:
  group: runtime-recovery-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python -m pip install 'Flask==3.1.1'
      - run: python -m unittest discover -s tests -p 'test_runtime_recovery*.py' -v
      - run: python -m compileall -q routes/config.py middleware/tenant_context.py tests/test_runtime_recovery_config.py tests/test_runtime_recovery_middleware.py
