name: Survey and organization evidence
"on":
  pull_request:
    paths:
      - services/survey_analytics_evidence.py
      - services/survey_fieldwork_coverage.py
      - services/encuestas_analytics_service.py
      - routes/encuestas_analytics.py
      - tests/test_survey_fieldwork_coverage.py
      - tests/survey_fieldwork_coverage_http.py
      - tests/test_survey_analytics_evidence.py
      - tests/survey_analytics_evidence_http.py
      - services/accessible_support_guide.py
      - services/tenant_conversation_guide.py
      - services/tenant_factory.py
      - services/organization_setup_journey.py
      - services/channel_activation.py
      - routes/admin_tenant.py
      - routes/auth.py
      - routes/v2/saas.py
      - data/conversation_guides/**
      - tests/private_conversation_guide_http.py
      - tests/organization_access_regression.py
      - tests/test_admin_tenant_verification.py
      - .github/workflows/survey-analytics-evidence.yml
permissions:
  contents: read
concurrency:
  group: analytics-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - run: python -m unittest tests.test_survey_analytics_evidence -v
      - run: python -m tests.survey_analytics_evidence_http
      - run: python -m unittest tests.test_survey_fieldwork_coverage -v
      - run: python -m tests.survey_fieldwork_coverage_http
      - run: python -m tests.organization_access_regression
      - run: python -m tests.private_conversation_guide_http
