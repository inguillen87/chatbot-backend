permissions:
  contents: read
concurrency:
  group: tdf-accessible-channel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-knowledge-and-meta-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install existing runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Verify tenant-scoped contact projections and current readers offline
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .qa-artifacts/contact-scope
          git rev-parse HEAD > .qa-artifacts/contact-scope/checkout.txt
          test "$(cat .qa-artifacts/contact-scope/checkout.txt)" = "$EXPECTED_HEAD"
          for cohort in new voice-context-cold survey-cold; do
            mkdir -p ".qa-artifacts/contact-scope/$cohort"
            python -I -B -X utf8 - "$cohort" <<'PY' 2>&1 | tee ".qa-artifacts/contact-scope/$cohort/tests.log"
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          cohort = sys.argv[1]
          out = root / '.qa-artifacts/contact-scope' / cohort
          paths = [
              'routes/whatsapp_webhook.py', 'services/contact_service.py',
              'services/municipio_responder.py', 'services/pymes.py',
              'services/voice_stream_service.py', 'services/whatsapp_conversation_turn.py',
              'services/whatsapp_survey_conversation.py', 'services/actions/municipio_actions.py',
              'tests/contact_scope_fixtures.py', 'tests/test_contact_scope_core.py',
              'tests/test_contact_scope_consumers.py', 'tests/test_contact_scope_inline_readers.py',
              'tests/test_contact_explicit_e164.py',
              'tests/test_whatsapp_welcome_each_greeting.py', 'tests/test_whatsapp_welcome_optional_audio.py',
              'tests/test_whatsapp_webhook.py', 'tests/test_whatsapp_inbound_queue_webhook.py',
              'tests/test_voice_stream_service.py', 'tests/test_whatsapp_survey_conversation.py',
              'models.py', 'model_primitives.py', 'models_memory.py', 'services/common_utils.py', 'services/pyme_menu.py',
              'tests/profile_acceptance_runtime.py', 'tests/conftest.py', 'pytest.ini',
              '.github/workflows/tdf-accessible-channel.yml',
          ]
          def pins():
              return {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in paths}
          before = pins()
          committed = {
              path: hashlib.sha256(subprocess.run(
                  ['git', 'show', 'HEAD:' + path], check=True, capture_output=True,
              ).stdout).hexdigest() for path in paths
          }
          (out / 'source-before.json').write_text(json.dumps(before, indent=2), encoding='utf-8')
          (out / 'source-git-head.json').write_text(json.dumps(committed, indent=2), encoding='utf-8')
          if before != committed:
              raise RuntimeError('contact_scope_checkout_blob_mismatch')
          sys.path.insert(0, str(root))
          from tests.profile_acceptance_runtime import prepare_process
          prepare_process()
          os.environ['CORS_ALLOWED_ORIGINS'] = 'https://panel.example.invalid'
          os.environ['PYTEST_DISABLE_PLUGIN_AUTOLOAD'] = '1'
          os.environ['PYTHONDONTWRITEBYTECODE'] = '1'
          watched = ('TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'OPENAI_API_KEY')
          environment_before = [key for key in watched if key in os.environ]
          if environment_before:
              raise RuntimeError('contact_scope_fixture_environment_not_clean')
          targets_by_cohort = {
              'new': [
                  'tests/test_contact_scope_core.py',
                  'tests/test_contact_scope_consumers.py',
                  'tests/test_contact_scope_inline_readers.py',
                  'tests/test_contact_explicit_e164.py',
              ],
              'voice-context-cold': [
                  'tests/test_voice_stream_service.py::VoiceStreamServiceTenantResolutionTests::test_provider_sender_routes_voice_to_dedicated_tenant',
              ],
              'survey-cold': [
                  'tests/test_whatsapp_survey_conversation.py::WhatsAppSurveyConversationTest::test_governed_yes_no_and_city_vote_pins_release_and_emits_realtime',
                  'tests/test_whatsapp_survey_conversation.py::WhatsAppSurveyConversationTest::test_duplicate_is_prevented_and_uncertain_retry_replays_same_submission',
              ],
          }
          targets = targets_by_cohort[cohort]
          import pytest
          collected = []
          class Collection:
              def pytest_collection_finish(self, session):
                  collected.extend(item.nodeid for item in session.items)
          args = ['-q', '-p', 'no:cacheprovider']
          if cohort == 'new':
              args.extend(['-p', 'tests.contact_scope_fixtures'])
          result = pytest.main([*args, *targets, '--junitxml=' + str(out / 'tests.xml')], plugins=[Collection()])
          after = pins()
          environment_after = [key for key in watched if key in os.environ]
          (out / 'source-after.json').write_text(json.dumps(after, indent=2), encoding='utf-8')
          (out / 'collected-nodeids.json').write_text(json.dumps(collected, indent=2), encoding='utf-8')
          (out / 'environment-presence.json').write_text(json.dumps({
              'watched_keys': watched, 'before': environment_before, 'after': environment_after,
              'values_recorded': False,
          }, indent=2), encoding='utf-8')
          counts = None
          native_testcase_elements = None
          if (out / 'tests.xml').is_file():
              report = ET.parse(out / 'tests.xml').getroot()
              suites = [node for node in report.iter('testsuite') if not node.findall('testsuite')]
              counts = {key: sum(int(node.attrib.get(key, 0)) for node in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              native_testcase_elements = len(list(report.iter('testcase')))
          covered = bool(collected) and len(collected) == len(set(collected)) and all(
              any(node == target or node.startswith(target + '::') or node.startswith(target + '[')
                  for node in collected) for target in targets
          )
          valid = (int(result) == 0 and before == committed == after and covered
                   and counts is not None and counts['tests'] > 0
                   and environment_before == environment_after
                   and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped')))
          summary = {
              'checkout': (out.parent / 'checkout.txt').read_text().strip(), 'cohort': cohort,
              'exit_code': int(result), 'targets': targets, 'collected_items': len(collected),
              'native_xml_counts': counts, 'native_testcase_elements': native_testcase_elements,
              'source_pins_unchanged': before == after, 'checkout_blob_equal': before == committed,
              'fixture_environment_restored': environment_before == environment_after,
              'provider_delivery_verified': False, 'production_state_verified': False, 'passed': valid,
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary))
          raise SystemExit(0 if valid else 1)
          PY
          done
      - name: Preserve tenant-scoped contact native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contact-scope-${{ github.event.pull_request.head.sha }}
          path: .qa-artifacts/contact-scope/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify production Meta outbox dispatch offline
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .qa-artifacts/meta-whatsapp-outbox
          git rev-parse HEAD > .qa-artifacts/meta-whatsapp-outbox/checkout.txt
          test "$(cat .qa-artifacts/meta-whatsapp-outbox/checkout.txt)" = "$EXPECTED_HEAD"
          python -I -B -X utf8 - <<'PY' 2>&1 | tee .qa-artifacts/meta-whatsapp-outbox/tests.log
          import hashlib, json, os, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          out = root / '.qa-artifacts/meta-whatsapp-outbox'
          paths = ['services/meta_whatsapp_runtime.py', 'services/meta_whatsapp_outbox.py',
                   'services/whatsapp_inbound_worker.py', 'tests/test_meta_whatsapp_outbox.py',
                   'tests/test_meta_whatsapp_scrub.py',
                   'tests/test_outbox_execution_budget.py', 'tests/test_twilio_provider_network_policy.py',
                   'tests/test_whatsapp_inbound_queue_webhook.py', 'tests/test_whatsapp_inbound_turns.py',
                   'services/meta_whatsapp_cloud.py', 'services/meta_whatsapp_webhook.py',
                   'services/meta_whatsapp_credentials.py', 'services/outbox_execution_budget.py',
                   'services/whatsapp_inbound_turns.py', 'services/whatsapp_inbound_durability.py',
                   'models.py', 'model_primitives.py', 'tests/profile_acceptance_runtime.py',
                   '.github/workflows/tdf-accessible-channel.yml']
          def pins(): return {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in paths}
          before = pins()
          (out / 'source-before.json').write_text(json.dumps(before, indent=2), encoding='utf-8')
          sys.path.insert(0, str(root))
          from tests.profile_acceptance_runtime import prepare_process
          prepare_process()
          os.environ['CORS_ALLOWED_ORIGINS'] = 'https://panel.example.invalid'
          os.environ['PYTEST_DISABLE_PLUGIN_AUTOLOAD'] = '1'
          os.environ['PYTHONDONTWRITEBYTECODE'] = '1'
          import pytest
          targets = [
              "tests/test_meta_whatsapp_outbox.py",
              "tests/test_meta_whatsapp_scrub.py",
              "tests/test_twilio_provider_network_policy.py::test_durable_worker_blocks_before_twilio_client_and_keeps_attempt_retryable",
              "tests/test_whatsapp_inbound_queue_webhook.py::WhatsAppInboundQueueWebhookTestCase::test_pre_provider_configuration_failure_is_retryable_not_uncertain",
              "tests/test_whatsapp_inbound_queue_webhook.py::WhatsAppInboundQueueWebhookTestCase::test_provider_timeout_is_uncertain_and_never_claimed_again",
              "tests/test_whatsapp_inbound_turns.py::test_outbound_attempts_are_fifo_within_a_stream",
              "tests/test_whatsapp_inbound_turns.py::test_expired_outbound_sending_becomes_uncertain_and_is_never_retried",
          ]
          result = pytest.main(['--noconftest', '-q', '-p', 'no:cacheprovider',
                                *targets, '--junitxml=' + str(out / 'tests.xml')])
          after = pins()
          (out / 'source-after.json').write_text(json.dumps(after, indent=2), encoding='utf-8')
          counts = None
          testcase_elements = None
          if (out / 'tests.xml').is_file():
              report = ET.parse(out / 'tests.xml').getroot()
              suites = [node for node in report.iter('testsuite') if not node.findall('testsuite')]
              counts = {key: sum(int(node.attrib.get(key, 0)) for node in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              testcase_elements = len(list(report.iter('testcase')))
          valid = (int(result) == 0 and before == after and counts is not None
                   and counts['tests'] > 0 and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped')))
          summary = {'checkout': (out / 'checkout.txt').read_text().strip(), 'exit_code': int(result),
                     'targets': targets, 'counts': counts, 'native_testcase_elements': testcase_elements,
                     'source_pins_unchanged': before == after, 'passed': valid}
          (out / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary))
          raise SystemExit(0 if valid else 1)
          PY
      - name: Preserve Meta outbox native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-whatsapp-outbox-${{ github.event.pull_request.head.sha }}
          path: .qa-artifacts/meta-whatsapp-outbox/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Verify dormant Meta callback, claim and CRM circuit offline
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out=.qa-artifacts/meta-native-claim
          mkdir -p "$out"
          git rev-parse HEAD > "$out/checkout.txt"
          test "$(cat "$out/checkout.txt")" = "$EXPECTED_HEAD"
          python -I -B -X utf8 - <<'PY' 2>&1 | tee "$out/tests.log"
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          out = root / '.qa-artifacts/meta-native-claim'
          checkout = (out / 'checkout.txt').read_text().strip()
          targets = [
              'tests/test_meta_channel_identity_admission.py',
              'tests/test_meta_media_url_binding.py',
              'tests/test_meta_native_media_output.py',
              'tests/test_meta_raw_batch_admission.py',
              'tests/test_meta_whatsapp_callback.py',
              'tests/test_meta_whatsapp_crm_acceptance.py',
              'tests/test_meta_whatsapp_inbound_execution_fence.py',
              'tests/test_meta_whatsapp_inbound_worker.py',
              'tests/test_meta_whatsapp_outbound_hold.py',
              'tests/test_meta_whatsapp_outbox.py',
              'tests/test_meta_whatsapp_welcome.py',
              'tests/test_meta_whatsapp_welcome_isolated.py',
              'tests/test_meta_provider_isolation.py',
              'tests/test_meta_provider_policy.py',
              'tests/test_meta_outbox_canary_scope.py',
              'tests/test_meta_credential_operations.py',
              'tests/test_whatsapp_webhook_twilio_scoping.py',
              'tests/test_municipal_conversation_uow.py',
              'tests/test_whatsapp_conversation_domain_writers.py',
              'tests/test_whatsapp_conversation_forwarding.py',
              'tests/test_whatsapp_conversation_uow.py',
              'tests/test_whatsapp_conversation_uow_direct_scope.py',
              'tests/test_whatsapp_conversation_uow_scope.py',
          ]
          paths = [
              'app.py', 'config/__init__.py', 'database.py', 'extensions.py', 'models.py', 'model_primitives.py',
              'routes/meta_whatsapp_callback.py', 'routes/whatsapp_webhook.py',
              'services/actions/municipio_actions.py', 'services/channel_session_identity.py',
              'services/contact_service.py', 'services/crm_intelligence.py',
              'services/domain_effect_gate.py', 'services/logic.py',
              'services/meta_whatsapp_batch_admission.py', 'services/meta_whatsapp_cloud.py',
              'services/meta_whatsapp_conversation_sink.py', 'services/meta_whatsapp_credentials.py',
              'services/meta_whatsapp_media.py', 'services/meta_whatsapp_outbox.py',
              'services/meta_whatsapp_runtime.py', 'services/meta_whatsapp_webhook.py',
              'services/meta_whatsapp_welcome.py', 'services/whatsapp_provider_policy.py',
              'services/meta_credential_operations.py', 'scripts/manage_meta_whatsapp_credentials.py',
              'services/common_utils.py',
              'services/municipal_conversation_uow.py', 'services/municipio_responder.py',
              'services/outbox_execution_budget.py', 'services/ticket_service.py',
              'services/whatsapp_conversation_contract.py', 'services/whatsapp_conversation_turn.py',
              'services/whatsapp_conversation_uow.py', 'services/whatsapp_inbound_durability.py',
              'services/whatsapp_inbound_turns.py', 'services/whatsapp_inbound_worker.py',
              'services/whatsapp_receipt_branding.py', 'services/whatsapp_receipts.py',
