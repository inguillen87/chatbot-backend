              raise SystemExit('Meta circuit test environment is not isolated')

          collected = []
          class CollectionEvidence:
              def pytest_collection_finish(self, session):
                  collected.extend(item.nodeid for item in session.items)

          report_path = out / 'tests.xml'
          result = pytest.main(['-q', '-p', 'no:cacheprovider', *targets,
                                '--junitxml=' + str(report_path)], plugins=[CollectionEvidence()])
          after = pins()
          head_after = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          env_after = [key for key in watched if key in os.environ]
          evidence('source-after.json', after)
          evidence('collected-nodeids.json', collected)
          evidence('environment-presence.json', {'before': env_before, 'after': env_after,
                                                 'values_recorded': False})
          counts = None
          testcase_elements = None
          if report_path.is_file():
              report = ET.parse(report_path).getroot()
              suites = [node for node in report.iter('testsuite') if not node.findall('testsuite')]
              counts = {key: sum(int(node.attrib.get(key, 0)) for node in suites)
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              testcase_elements = len(list(report.iter('testcase')))
          covered = bool(collected) and len(collected) == len(set(collected)) and all(
              any(node.startswith(target + '::') for node in collected) for target in targets)
          valid = (int(result) == 0 and checkout == head_after and before == committed == after
                   and covered and not env_after and counts is not None
                   and counts['tests'] == testcase_elements == len(collected)
                   and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped')))
          summary = {
              'checkout': checkout, 'checkout_after': head_after, 'exit_code': int(result),
              'targets': targets, 'collected_items': len(collected), 'native_xml_counts': counts,
              'native_testcase_elements': testcase_elements, 'source_pins_unchanged': before == after,
              'checkout_blob_equal': before == committed, 'fixture_environment_restored': env_before == env_after,
              'report_sha256': digest(report_path.read_bytes()) if report_path.is_file() else None,
              'provider_delivery_verified': False, 'production_state_verified': False, 'passed': valid,
          }
          evidence('summary.json', summary)
          print(json.dumps(summary))
          raise SystemExit(0 if valid else 1)
