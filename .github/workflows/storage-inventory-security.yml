name: Storage inventory security contract

"on":
  pull_request:
    paths:
      - .github/workflows/storage-inventory-security.yml
      - .github/requirements/storage-inventory-linux-py312.txt
      - docs/storage-migration-runbook.md
      - requirements.txt
      - requirements_fixed.txt
      - scripts/inventory_persistent_data.py
      - tests/test_inventory_persistent_data.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix-contract:
    name: POSIX inventory contract (Python 3.12.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          architecture: x64

      - name: Install hash-locked focal dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement .github/requirements/storage-inventory-linux-py312.txt
          python -m pip check

      - name: Require runtime dependency alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "cffi==2.1.1",
              "cryptography==50.0.0",
              "pycparser==3.0",
              "pyOpenSSL==26.4.0",
          }
          for filename in ("requirements.txt", "requirements_fixed.txt"):
              pins = {
                  line.strip()
                  for line in Path(filename).read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              }
              missing = sorted(required - pins)
              if missing:
                  raise SystemExit(f"{filename} missing aligned pins: {missing}")
          PY

      - name: Require descriptor-relative POSIX support
        run: |
          python - <<'PY'
          import os
          from scripts.inventory_persistent_data import _descriptor_traversal_available

          if os.name != "posix" or not _descriptor_traversal_available():
              raise SystemExit("required POSIX descriptor-relative contract unavailable")
          PY

      - name: Compile focal implementation and tests
        run: >-
          python -m py_compile scripts/inventory_persistent_data.py
          tests/test_inventory_persistent_data.py

      - name: Run storage inventory security tests
        run: python -m unittest tests.test_inventory_persistent_data -v
