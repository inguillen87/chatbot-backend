name: CRM task PostgreSQL transactions
"on":
  pull_request:
    paths:
      - models_crm_tasks.py
      - services/crm_tasks.py
      - services/crm_task_schema.py
      - services/crm_task_rollout.py
      - scripts/preflight_crm_tasks.py
      - tests/test_crm_task_rollout.py
      - tests/test_crm_tasks_preflight.py
      - tests/crm_task_pg_rollout_invariants.py
      - routes/crm/tasks.py
      - migrations/pending/20260924_crm_tasks_v1.py
      - tests/crm_tasks_postgres_acceptance.py
      - tests/crm_task_invariants.py
      - .github/workflows/crm-task-transactions.yml
permissions:
  contents: read
concurrency:
  group: crm-task-transactions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: task_qa
          POSTGRES_PASSWORD: task_qa_disposable_only
          POSTGRES_DB: chatboc_tasks_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_qa -d chatboc_tasks_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CHATBOC_TASKS_QA_DSN: postgresql+psycopg2://task_qa:task_qa_disposable_only@127.0.0.1:5432/chatboc_tasks_qa
      TASK_QA_EVIDENCE: task-postgres-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Isolated transaction dependencies
        run: python -m pip install Flask==3.1.1 Flask-SQLAlchemy==3.1.1 SQLAlchemy==2.0.41 alembic==1.16.2 psycopg2-binary==2.9.9
      - name: Rollout policy and read-only preflight
        run: python -m unittest tests.test_crm_task_rollout tests.test_crm_tasks_preflight -v
      - name: Original task service and migration on PostgreSQL
        run: python tests/crm_tasks_postgres_acceptance.py
      - name: Transaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-task-postgres-evidence
          path: task-postgres-evidence/
          if-no-files-found: ignore
          retention-days: 7
