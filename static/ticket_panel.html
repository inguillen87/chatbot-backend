<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Atención - ChatBoc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .chat-container { height: calc(100vh - 64px); }
        .message-bubble { max-width: 80%; word-wrap: break-word; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .loading-spinner { border-top-color: transparent; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b h-16 flex items-center justify-between px-6 shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg">
                <i class="fa-solid fa-headset"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Panel de Atención</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="connectionStatus" class="text-xs font-medium text-green-600 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Conectado
            </span>
            <div class="text-sm text-gray-600" id="userInfo">Cargando usuario...</div>
            <button onclick="logout()" class="text-gray-500 hover:text-red-600 transition">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar: Ticket List -->
        <aside class="w-96 bg-white border-r flex flex-col shadow-md z-0">
            <!-- Filters -->
            <div class="p-4 border-b space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, ID o DNI..."
                           class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition">
                </div>
                <div class="flex gap-2">
                    <select id="statusFilter" class="flex-1 p-2 border rounded-lg text-sm bg-gray-50 focus:ring-1 focus:ring-blue-500">
                        <option value="">Todos los estados</option>
                        <option value="nuevo">Nuevos</option>
                        <option value="en_proceso" selected>En Proceso</option>
                        <option value="cerrado">Cerrados</option>
                    </select>
                    <button onclick="fetchTickets()" class="p-2 text-gray-600 hover:bg-gray-100 rounded-lg" title="Recargar">
                        <i class="fa-solid fa-sync"></i>
                    </button>
                </div>
            </div>

            <!-- Ticket List -->
            <div id="ticketList" class="flex-1 overflow-y-auto p-2 space-y-2 bg-gray-50">
                <!-- Template for Loading -->
                <div class="text-center py-10 text-gray-400">
                    <div class="animate-spin inline-block w-6 h-6 border-2 border-current border-t-transparent rounded-full mb-2"></div>
                    <p class="text-xs">Cargando tickets...</p>
                </div>
            </div>
        </aside>

        <!-- Main: Chat Area -->
        <main class="flex-1 flex flex-col bg-gray-100 relative">

            <!-- Welcome / Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-0">
                <i class="fa-regular fa-comments text-6xl mb-4 opacity-50"></i>
                <p class="text-lg font-medium">Selecciona un ticket para comenzar a chatear</p>
            </div>

            <!-- Chat Container (Hidden initially) -->
            <div id="chatInterface" class="hidden flex-col h-full z-10 w-full">

                <!-- Chat Header -->
                <div class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
                    <div>
                        <h2 id="currentTicketTitle" class="text-lg font-bold text-gray-800">Ticket #...</h2>
                        <p id="currentTicketSubtitle" class="text-sm text-gray-500">...</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleTicketDetails()" class="px-3 py-1.5 text-sm border rounded hover:bg-gray-50 text-gray-700">
                            <i class="fa-solid fa-info-circle mr-1"></i> Detalles
                        </button>
                        <button onclick="changeStatus('cerrado')" class="px-3 py-1.5 text-sm bg-red-100 text-red-700 border border-red-200 rounded hover:bg-red-200">
                            <i class="fa-solid fa-check mr-1"></i> Resolver
                        </button>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Messages will be injected here -->
                </div>

                <!-- Input Area -->
                <div class="bg-white border-t p-4">
                    <form id="replyForm" class="flex gap-2 items-end">
                        <div class="relative flex-1">
                            <textarea id="messageInput" rows="1" placeholder="Escribe tu respuesta..."
                                      class="w-full p-3 pr-10 border rounded-xl resize-none focus:ring-2 focus:ring-blue-500 outline-none max-h-32"></textarea>
                            <label class="absolute right-3 bottom-3 cursor-pointer text-gray-400 hover:text-blue-600" title="Adjuntar archivo">
                                <i class="fa-solid fa-paperclip"></i>
                                <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect()">
                            </label>
                        </div>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl shadow-lg transition transform hover:scale-105">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                    <div id="filePreview" class="hidden mt-2 text-xs text-gray-600 bg-gray-100 p-2 rounded flex justify-between items-center">
                        <span id="fileName">archivo.pdf</span>
                        <button onclick="clearFile()" class="text-red-500 hover:text-red-700">&times;</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Panel: Info (Collapsible) -->
        <aside id="detailsPanel" class="w-80 bg-white border-l shadow-xl transform translate-x-full transition-transform duration-300 absolute right-0 h-full z-20 overflow-y-auto">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-700">Detalles del Reclamo</h3>
                <button onclick="toggleTicketDetails()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6 space-y-6" id="detailsContent">
                <!-- Details injected via JS -->
            </div>
        </aside>

    </div>

    <script>
        // --- State ---
        let currentTicketId = null;
        let currentTicketType = 'municipio'; // 'municipio' or 'pyme'
        let tickets = [];
        let pollingInterval = null;
        let isSending = false;

        const API_BASE = '/api'; // Assuming routes are under /api or root. Routes in ticket.py start with /tickets
        const ROUTES_BASE = ''; // The flask routes are at root /tickets, so relative paths work.

        // --- Auth Check ---
        function getToken() {
            // Try to find token in localStorage, sessionStorage, or infer from browser session cookie
            // For this implementation, we assume the browser cookie set by Flask-Login is active.
            // If we needed a Bearer token, we'd retrieve it here.
            return localStorage.getItem('auth_token');
        }

        async function apiCall(endpoint, method = 'GET', body = null, isMultipart = false) {
            const headers = {};
            if (!isMultipart) {
                headers['Content-Type'] = 'application/json';
            }
            const token = getToken();
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const options = { method, headers };
            if (body) {
                options.body = isMultipart ? body : JSON.stringify(body);
            }

            try {
                const res = await fetch(endpoint, options);
                if (res.status === 401 || res.status === 403) {
                    // Handle unauthorized - maybe redirect to login
                    // window.location.href = '/login';
                    document.getElementById('userInfo').innerText = "Sesión expirada";
                    document.getElementById('userInfo').classList.add('text-red-500');
                    return null;
                }
                if (!res.ok) throw new Error(await res.text());
                return await res.json();
            } catch (err) {
                console.error("API Error:", err);
                return null;
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchTickets();
            // Start periodic refresh of list
            setInterval(() => {
                if (!currentTicketId) fetchTickets(true); // Only background refresh list if not chatting hard
            }, 30000);

            // Textarea auto-resize
            const tx = document.getElementById('messageInput');
            tx.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Handle Enter key
            tx.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('replyForm').dispatchEvent(new Event('submit'));
                }
            });

            document.getElementById('replyForm').addEventListener('submit', sendMessage);
            document.getElementById('searchInput').addEventListener('input', debounce(fetchTickets, 500));
            document.getElementById('statusFilter').addEventListener('change', fetchTickets);
        });

        // --- Functions ---

        async function fetchTickets(isBackground = false) {
            const status = document.getElementById('statusFilter').value;
            const query = document.getElementById('searchInput').value;

            let url = `/tickets/panel?page=1&per_page=50`; // Use new unified endpoint
            if (status) url += `&estado=${status}`;
            if (query) url += `&q=${encodeURIComponent(query)}`;

            if (!isBackground) {
                document.getElementById('ticketList').innerHTML = '<div class="text-center py-4 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
            }

            const data = await apiCall(url);
            if (data && data.tickets) {
                tickets = data.tickets; // Normalized list
                renderTicketList();
            } else if (!isBackground) {
                document.getElementById('ticketList').innerHTML = '<div class="text-center py-4 text-red-400">Error al cargar tickets</div>';
            }
        }

        function renderTicketList() {
            const list = document.getElementById('ticketList');
            list.innerHTML = '';

            if (tickets.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">No hay tickets que coincidan.</div>';
                return;
            }

            tickets.forEach(ticket => {
                const isActive = currentTicketId === ticket.id;
                const date = new Date(ticket.fecha).toLocaleDateString('es-AR', {day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit'});
                const unread = false; // Logic for unread badges would go here

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl cursor-pointer transition border border-transparent ${isActive ? 'bg-blue-50 border-blue-200 shadow-sm' : 'bg-white hover:bg-gray-50 border-gray-100'} mb-2`;
                card.onclick = () => selectTicket(ticket);

                let statusColor = 'bg-gray-100 text-gray-600';
                if (ticket.estado === 'nuevo') statusColor = 'bg-green-100 text-green-700';
                if (ticket.estado === 'en_proceso') statusColor = 'bg-blue-100 text-blue-700';
                if (ticket.estado === 'cerrado' || ticket.estado === 'resuelto') statusColor = 'bg-gray-200 text-gray-500';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-gray-800 text-sm truncate w-2/3">${ticket.nro_ticket || ('#' + ticket.id)}</span>
                        <span class="text-xs text-gray-400 whitespace-nowrap">${date}</span>
                    </div>
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="text-sm font-medium text-gray-700 truncate w-3/4" title="${ticket.asunto}">${ticket.asunto || 'Sin asunto'}</h4>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs px-2 py-0.5 rounded-full ${statusColor}">${ticket.estado.replace('_', ' ')}</span>
                        <span class="text-xs text-gray-400 truncate max-w-[40%]">${ticket.nombre_usuario || 'Anónimo'}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function selectTicket(ticket) {
            currentTicketId = ticket.id;
            currentTicketType = ticket.tipo || 'municipio';

            // Update UI selection
            renderTicketList();

            // Switch View
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('chatInterface').classList.remove('hidden');
            document.getElementById('chatInterface').classList.add('flex');

            // Header Info
            document.getElementById('currentTicketTitle').innerText = `${ticket.nro_ticket || '#' + ticket.id}: ${ticket.asunto}`;
            document.getElementById('currentTicketSubtitle').innerText = `${ticket.nombre_usuario || 'Vecino'} - ${ticket.categoria || 'General'}`;

            // Load Details for sidebar
            loadTicketDetails(ticket);

            // Load Chat History
            await loadChatHistory();

            // Start Polling
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(loadChatHistory, 5000); // 5 seconds poll
        }

        function loadTicketDetails(ticket) {
            // Fill sidebar details
            const html = `
                <div class="space-y-4 text-sm">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase">Estado</label>
                        <span class="inline-block mt-1 px-2 py-1 bg-gray-100 rounded text-gray-700 capitalize">${ticket.estado.replace('_', ' ')}</span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase">Descripción</label>
                        <p class="text-gray-700 mt-1">${ticket.description || ticket.detalles || 'Sin descripción'}</p>
                    </div>
                    <hr>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase">Contacto</label>
                        <div class="mt-2 space-y-1">
                            <div class="flex items-center gap-2"><i class="fa-solid fa-user w-4 text-gray-400"></i> <span>${ticket.nombre_usuario || '-'}</span></div>
                            <div class="flex items-center gap-2"><i class="fa-solid fa-phone w-4 text-gray-400"></i> <span>${ticket.telefono || '-'}</span></div>
                            <div class="flex items-center gap-2"><i class="fa-solid fa-envelope w-4 text-gray-400"></i> <span>${ticket.email || '-'}</span></div>
                            <div class="flex items-center gap-2"><i class="fa-solid fa-map-marker-alt w-4 text-gray-400"></i> <span>${ticket.direccion || '-'}</span></div>
                        </div>
                    </div>
                    <hr>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase">Datos Técnicos</label>
                        <div class="mt-2 space-y-1 text-xs text-gray-500">
                            <p>ID: ${ticket.id}</p>
                            <p>Tipo: ${ticket.tipo}</p>
                            <p>Creado: ${new Date(ticket.fecha).toLocaleString()}</p>
                            ${ticket.latitud ? `<a href="https://maps.google.com/?q=${ticket.latitud},${ticket.longitud}" target="_blank" class="text-blue-500 hover:underline">Ver en Mapa</a>` : ''}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detailsContent').innerHTML = html;
        }

        async function loadChatHistory() {
            if (!currentTicketId) return;

            // Endpoint: /tickets/chat/<id>/mensajes
            // Note: If type is pyme, route is /tickets/chat/pyme/<id>/mensajes
            let url = `/tickets/chat/${currentTicketId}/mensajes`;
            if (currentTicketType === 'pyme') {
                url = `/tickets/chat/pyme/${currentTicketId}/mensajes`;
            }

            const data = await apiCall(url);
            if (!data || !data.mensajes) return;

            renderMessages(data.mensajes);
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesArea');
            // Check if we should scroll to bottom (if already at bottom)
            const isAtBottom = container.scrollHeight - container.scrollTop === container.clientHeight;

            container.innerHTML = '';

            messages.forEach(msg => {
                const isAgent = msg.es_admin; // Boolean from API
                const alignClass = isAgent ? 'items-end' : 'items-start';
                const bubbleClass = isAgent ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none';
                const time = new Date(msg.fecha).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                let content = msg.texto || msg.comentario || '';
                // Handle file attachments link in text if formatted by backend
                // Or if there is a separate attachment field (depends on API)
                // For now, assume text contains link or is plain text.
                content = content.replace(/\n/g, '<br>');

                const div = document.createElement('div');
                div.className = `flex flex-col ${alignClass} mb-3`;
                div.innerHTML = `
                    <div class="flex items-end gap-2 max-w-[80%] ${isAgent ? 'flex-row-reverse' : 'flex-row'}">
                        <div class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs text-gray-500 flex-shrink-0">
                            ${isAgent ? '<i class="fa-solid fa-headset"></i>' : '<i class="fa-solid fa-user"></i>'}
                        </div>
                        <div class="message-bubble px-4 py-2 rounded-2xl shadow-sm ${bubbleClass} text-sm">
                            ${content}
                        </div>
                    </div>
                    <span class="text-[10px] text-gray-400 mt-1 px-9">${time}</span>
                `;
                container.appendChild(div);
            });

            // Scroll to bottom on load
            // Only force scroll if it was at bottom or first load
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage(e) {
            e.preventDefault();
            if (isSending) return;
            isSending = true;

            const input = document.getElementById('messageInput');
            const fileInput = document.getElementById('fileInput');
            const text = input.value.trim();
            const file = fileInput.files[0];

            if (!text && !file) {
                isSending = false;
                return;
            }

            // Endpoint: /tickets/<tipo>/<id>/responder
            const url = `/tickets/${currentTicketType}/${currentTicketId}/responder`;

            let success = false;

            // Optimistic UI update (could add a pending message here)

            if (file) {
                const formData = new FormData();
                formData.append('comentario', text);
                formData.append('archivos', file);
                const res = await apiCall(url, 'POST', formData, true); // true for multipart
                if (res) success = true;
            } else {
                const res = await apiCall(url, 'POST', { comentario: text });
                if (res) success = true;
            }

            if (success) {
                input.value = '';
                input.style.height = 'auto';
                clearFile();
                await loadChatHistory(); // Refresh chat
            } else {
                alert('Error al enviar mensaje');
            }

            isSending = false;
        }

        async function changeStatus(newStatus) {
            if (!confirm('¿Estás seguro de cambiar el estado a ' + newStatus + '?')) return;
            const url = `/tickets/${currentTicketType}/${currentTicketId}/estado`;
            const res = await apiCall(url, 'PUT', { estado: newStatus });
            if (res) {
                fetchTickets(); // Refresh list
                alert('Estado actualizado');
            }
        }

        function handleFileSelect() {
            const file = document.getElementById('fileInput').files[0];
            if (file) {
                document.getElementById('fileName').innerText = file.name;
                document.getElementById('filePreview').classList.remove('hidden');
            }
        }

        function clearFile() {
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.add('hidden');
        }

        function toggleTicketDetails() {
            const panel = document.getElementById('detailsPanel');
            panel.classList.toggle('translate-x-full');
        }

        function debounce(func, timeout = 300){
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        function logout() {
            // Implement logout logic (clear token, redirect)
            window.location.href = '/logout'; // Assuming backend handles session clear
        }

    </script>
</body>
</html>
