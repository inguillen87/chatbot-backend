<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .header { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 36px; fill: #e0f2fe; }
      .sub { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #bae6fd; }
      .hub { fill: #38bdf8; stroke: #0ea5e9; stroke-width: 2; }
      .hub-label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; fill: #f8fafc; font-weight: 600; }
      .line { stroke: #7dd3fc; stroke-width: 2.4; stroke-linecap: round; }
      .badge { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #e0f2fe; }
    </style>
  </defs>
  <rect width="960" height="540" rx="26" class="bg"/>
  <text x="480" y="90" class="header" text-anchor="middle">Red de Hubs Axis Logistics</text>
  <text x="480" y="124" class="sub" text-anchor="middle">Fulfillment omnicanal · cross-dock · última milla</text>

  <g transform="translate(120,150)">
    <path d="M60,60 C180,20 320,40 450,110" class="line"/>
    <path d="M450,110 C560,170 620,190 720,80" class="line"/>
    <path d="M450,110 C520,240 480,300 360,320" class="line"/>
    <path d="M320,60 C340,160 220,260 120,300" class="line"/>

    <g transform="translate(60,60)">
      <circle r="26" class="hub"/>
      <text y="-38" text-anchor="middle" class="hub-label">Mendoza</text>
      <text y="48" text-anchor="middle" class="badge">Cross-dock regional · 6K pedidos/día</text>
    </g>
    <g transform="translate(320,60)">
      <circle r="30" class="hub" fill="#22d3ee"/>
      <text y="-42" text-anchor="middle" class="hub-label">Córdoba</text>
      <text y="46" text-anchor="middle" class="badge">Next-day interior · 12K pedidos/día</text>
    </g>
    <g transform="translate(580,80)">
      <circle r="34" class="hub" fill="#0ea5e9"/>
      <text y="-44" text-anchor="middle" class="hub-label">CABA</text>
      <text y="48" text-anchor="middle" class="badge">Same-day AMBA · 22K pedidos/día</text>
    </g>
    <g transform="translate(450,200)">
      <circle r="24" class="hub" fill="#2dd4bf"/>
      <text y="-38" text-anchor="middle" class="hub-label">Rosario</text>
      <text y="42" text-anchor="middle" class="badge">Consolida litoral · 8K pedidos/día</text>
    </g>
    <g transform="translate(260,260)">
      <circle r="22" class="hub" fill="#a5f3fc"/>
      <text y="-34" text-anchor="middle" class="hub-label">Neuquén</text>
      <text y="38" text-anchor="middle" class="badge">Operación oil & gas · 3K pedidos/día</text>
    </g>
    <g transform="translate(120,300)">
      <circle r="20" class="hub" fill="#38bdf8"/>
      <text y="-32" text-anchor="middle" class="hub-label">San Juan</text>
      <text y="34" text-anchor="middle" class="badge">Soporte vitivinícola · 2K pedidos/día</text>
    </g>
  </g>

  <g transform="translate(80,400)">
    <rect x="0" y="0" width="800" height="110" rx="18" fill="rgba(14,116,144,0.35)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="24" y="38" class="badge">• Ventanas same-day AMBA · next-day interior · crossborder Chile/Uruguay 48 h.</text>
    <text x="24" y="68" class="badge">• Torre de control con visibilidad de inventario, KPIs OTIF 95% y alertas CO₂.</text>
    <text x="24" y="96" class="badge">• Integraciones OMS/WMS/TMS + partners aéreos y lockers inteligentes.</text>
  </g>
</svg>
