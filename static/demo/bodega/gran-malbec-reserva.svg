<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0914" />
      <stop offset="55%" stop-color="#1f1122" />
      <stop offset="100%" stop-color="#351c30" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e4b8" />
      <stop offset="100%" stop-color="#c99b63" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)" />
  <rect x="24" y="24" width="912" height="492" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <text x="72" y="110" fill="#f8ecd4" font-family="'Playfair Display', Georgia, serif" font-size="54">Gran Malbec Reserva 2021</text>
  <text x="72" y="154" fill="#f8ecd4" font-family="Helvetica, Arial, sans-serif" font-size="22">IG Paraje Altamira · Perdriel · Mendoza · Cuatro Fincas Winery</text>

  <g transform="translate(72,190)">
    <rect width="255" height="250" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(201,155,99,0.4)" />
    <text x="24" y="38" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Origen &amp; viñedos</text>
    <text x="24" y="72" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="15">
      <tspan x="24" dy="0">• Parcelas: Altamira (Valle de Uco) &amp; Agrelo</tspan>
      <tspan x="24" dy="22">• Altitud: 1.050 m s. n. m. · Suelos calcáreos</tspan>
      <tspan x="24" dy="22">• Vendimia manual nocturna en cajas de 12 kg</tspan>
      <tspan x="24" dy="22">• Selección grano a grano y uso de levaduras nativas</tspan>
      <tspan x="24" dy="22">• Producción limitada: 4.800 botellas</tspan>
    </text>

    <line x1="24" y1="202" x2="231" y2="202" stroke="rgba(201,155,99,0.35)" stroke-width="1" />
    <text x="24" y="228" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="14">Certificación sustentable · Riego por goteo inteligente</text>
  </g>

  <g transform="translate(347,190)">
    <rect width="255" height="250" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(201,155,99,0.4)" />
    <text x="24" y="38" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Vinificación</text>
    <text x="24" y="72" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="15">
      <tspan x="24" dy="0">• Maceración prefermentativa en frío 5 días</tspan>
      <tspan x="24" dy="22">• Fermentación en vasijas de hormigón troncocónicas</tspan>
      <tspan x="24" dy="22">• Remontajes suaves + délestage controlado</tspan>
      <tspan x="24" dy="22">• Crianza 14 meses en barricas francesas 1er/2do uso</tspan>
      <tspan x="24" dy="22">• Estabilización natural · embotellado sin filtrar</tspan>
    </text>

    <line x1="24" y1="202" x2="231" y2="202" stroke="rgba(201,155,99,0.35)" stroke-width="1" />
    <text x="24" y="228" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="14">Guardado mínimo en botella: 6 meses antes de release</text>
  </g>

  <g transform="translate(622,190)">
    <rect width="255" height="250" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(201,155,99,0.4)" />
    <text x="24" y="38" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Notas de cata</text>
    <text x="24" y="72" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="15">
      <tspan x="24" dy="0">• Nariz: mora silvestre, ciruela negra y flores azules</tspan>
      <tspan x="24" dy="22">• Boca: entrada envolvente, taninos satinados, cacao</tspan>
      <tspan x="24" dy="22">• Final: largo, herbal (tomillo andino) y mineralidad</tspan>
      <tspan x="24" dy="22">• Maridajes: ojo de bife, cordero braseado, provoleta</tspan>
      <tspan x="24" dy="22">• Servicio: 16 °C · decantar 45 minutos</tspan>
    </text>

    <line x1="24" y1="202" x2="231" y2="202" stroke="rgba(201,155,99,0.35)" stroke-width="1" />
    <text x="24" y="228" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="14">Consumo óptimo 2024 – 2030</text>
  </g>

  <g transform="translate(72,470)">
    <rect width="805" height="58" rx="18" fill="rgba(255,255,255,0.05)" />
    <text x="24" y="32" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="16">
      Datos analíticos: Alc 14,2% · Acidez total 5,7 g/l · Azúcar < 2 g/l · pH 3,6 · Sulfitos totales 90 mg/l
    </text>
  </g>

  <g transform="translate(640,120)">
    <rect width="212" height="48" rx="16" fill="rgba(255,255,255,0.08)" stroke="url(#gold)" stroke-width="1" />
    <text x="24" y="30" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="16">94 pts Tim Atkin · 93 pts Descorchados</text>
  </g>

  <text x="72" y="520" fill="#f6e4b8" font-family="Helvetica, Arial, sans-serif" font-size="16">Contacto trade: ventas@cuatrofincas.com · +54 9 261 555 0000 · www.cuatrofincas.com</text>
