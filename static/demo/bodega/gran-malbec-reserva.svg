<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12090f" />
      <stop offset="60%" stop-color="#2f1220" />
      <stop offset="100%" stop-color="#4c2135" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d6a2" />
      <stop offset="100%" stop-color="#b98f5f" />
    </linearGradient>
  </defs>
  <rect fill="url(#night)" width="960" height="540" rx="24" />

  <text x="80" y="120" fill="#f8e9d0" font-family="'Playfair Display', Georgia, serif" font-size="56">Gran Malbec Reserva 2021</text>
  <text x="80" y="170" fill="#f8e9d0" font-family="'Playfair Display', Georgia, serif" font-size="26">Cuatro Fincas Winery · Perdriel, Lujan de Cuyo</text>

  <rect x="80" y="210" width="360" height="230" fill="rgba(255,255,255,0.05)" stroke="#b98f5f" stroke-width="1" rx="18" />
  <text x="110" y="250" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Origen y vinificacion</text>
  <text x="110" y="282" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="16">
    <tspan x="110" dy="0">• Parcelas de Vistalba y Agrelo · 1.050 m.s.n.m.</tspan>
    <tspan x="110" dy="24">• Vendimia manual en cajas de 12 kg · selecciones en cinta.</tspan>
    <tspan x="110" dy="24">• Maceracion fria 5 dias · 14 meses en barricas francesas 1er y 2do uso.</tspan>
    <tspan x="110" dy="24">• Embotellado sin clarificar · guarda minima 6 meses.</tspan>
  </text>

  <rect x="480" y="210" width="360" height="230" fill="rgba(255,255,255,0.05)" stroke="#b98f5f" stroke-width="1" rx="18" />
  <text x="510" y="250" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Notas de cata</text>
  <text x="510" y="282" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="16">
    <tspan x="510" dy="0">• Aroma: moras silvestres, ciruela negra, cascara de naranja.</tspan>
    <tspan x="510" dy="24">• Boca: entrada voluptuosa, taninos satinados, notas de cacao y tabaco dulce.</tspan>
    <tspan x="510" dy="24">• Final: largo y vertical con recuerdos a tomillo andino.</tspan>
    <tspan x="510" dy="24">• Maridajes: ojo de bife, cordero braseado, quesos estacionados.</tspan>
  </text>

  <text x="80" y="470" fill="#f8e9d0" font-family="Helvetica, Arial, sans-serif" font-size="18">Servicio 16 °C · Decantar 45 minutos · Produccion limitada 4.800 botellas</text>

  <g transform="translate(620,430)">
    <rect x="0" y="-42" width="260" height="74" rx="14" fill="rgba(255,255,255,0.08)" stroke="#f2d6a2" stroke-width="1" />
    <text x="20" y="-10" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="14">Premios 2024</text>
    <text x="20" y="14" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="16">94 pts Tim Atkin · 93 pts Descorchados</text>
  </g>

  <text x="80" y="510" fill="#f7e3be" font-family="Helvetica, Arial, sans-serif" font-size="16">Contacto Trade: ventas@cuatrofincas.com · +54 9 261 555 0000</text>
</svg>
