<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .header { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 36px; fill: #f8fafc; }
      .sub { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #cbd5f5; }
      .badge { fill: rgba(59,130,246,0.18); stroke: #60a5fa; stroke-width: 1.4; }
      .node { fill: #0f172a; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 15px; }
      .node-bg { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2; }
      .connector { stroke: #93c5fd; stroke-width: 2.2; stroke-linecap: round; }
      .label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #f1f5f9; }
    </style>
  </defs>
  <rect width="960" height="540" rx="26" class="bg"/>
  <text x="520" y="90" class="header" text-anchor="middle">Red de Asistencia ShieldOne</text>
  <text x="520" y="125" class="sub" text-anchor="middle">Talleres · clínicas · grúas · response 24/7</text>

  <g transform="translate(80,160)">
    <rect x="0" y="0" width="240" height="110" rx="18" class="badge"/>
    <text x="120" y="38" class="label" text-anchor="middle">+320 nodos certificados</text>
    <text x="120" y="70" class="label" text-anchor="middle">SLA promedio 45' asistencia</text>
  </g>

  <g transform="translate(320,170)">
    <circle cx="160" cy="120" r="110" fill="rgba(59,130,246,0.12)" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="160" cy="120" r="8" fill="#1d4ed8"/>
    <text x="160" y="110" text-anchor="middle" class="label">Centro de comando</text>
  </g>

  <g id="nodos" transform="translate(320,170)">
    <g transform="translate(160,10)">
      <rect x="-80" y="-32" width="160" height="64" rx="16" class="node-bg"/>
      <text x="0" y="4" class="node" text-anchor="middle">Clínicas premium</text>
      <text x="0" y="24" class="node" text-anchor="middle">Trauma · Alta complejidad</text>
    </g>
    <g transform="translate(290,120)">
      <rect x="-80" y="-32" width="160" height="64" rx="16" class="node-bg" fill="#bbf7d0" stroke="#22c55e"/>
      <text x="0" y="4" class="node" text-anchor="middle">Talleres certific.</text>
      <text x="0" y="24" class="node" text-anchor="middle">Pick-up / entrega 48h</text>
    </g>
    <g transform="translate(160,230)">
      <rect x="-80" y="-32" width="160" height="64" rx="16" class="node-bg" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="0" y="4" class="node" text-anchor="middle">Grúas + remolques</text>
      <text x="0" y="24" class="node" text-anchor="middle">Cobertura nacional</text>
    </g>
    <g transform="translate(30,120)">
      <rect x="-80" y="-32" width="160" height="64" rx="16" class="node-bg" fill="#ede9fe" stroke="#8b5cf6"/>
      <text x="0" y="4" class="node" text-anchor="middle">Telemedicina</text>
      <text x="0" y="24" class="node" text-anchor="middle">Videoconsulta 12'</text>
    </g>
  </g>

  <g transform="translate(320,170)">
    <path d="M160,20 L160,80" class="connector"/>
    <path d="M160,160 L160,220" class="connector"/>
    <path d="M60,120 L120,120" class="connector"/>
    <path d="M200,120 L260,120" class="connector"/>
  </g>

  <g transform="translate(80,360)">
    <rect x="0" y="0" width="800" height="120" rx="18" fill="rgba(30,64,175,0.45)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="30" y="42" class="label">• Protocolos HSEQ y compliance internacional auditados trimestralmente.</text>
    <text x="30" y="72" class="label">• Integración en tiempo real con mesa ejecutiva, brokers y clientes enterprise.</text>
    <text x="30" y="102" class="label">• Indicadores clave: TMO 6.2 días · Satisfacción NPS 78 · Reclamos críticos <1%.</text>
  </g>
</svg>
