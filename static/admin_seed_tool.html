<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Respuestas Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 2rem; }
        .card { box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); border: none; }
        .card-header { background-color: #4f46e5; color: white; font-weight: bold; }
        #logArea { font-family: monospace; font-size: 0.9rem; background-color: #1e1e1e; color: #00ff00; padding: 1rem; border-radius: 0.25rem; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-header">
                        🚀 Seed Demo: Generador de Encuestas Random
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Utiliza esta herramienta para poblar encuestas con datos de prueba realistas para demostraciones.</p>

                        <form id="seedForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="apiUrl" class="form-label">URL del Backend</label>
                                    <input type="text" class="form-control" id="apiUrl" value="/api/admin/encuestas" placeholder="https://api.tudominio.com/api/admin/encuestas">
                                    <div class="form-text">Base URL para la API admin.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="authToken" class="form-label">Token de Admin</label>
                                    <input type="password" class="form-control" id="authToken" placeholder="Bearer eyJhbGciOiJIUz...">
                                    <div class="form-text">Token JWT de un usuario administrador.</div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="encuestaId" class="form-label">ID de Encuesta</label>
                                <input type="number" class="form-control" id="encuestaId" required placeholder="Ej: 341">
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="cantidad" class="form-label">Cantidad</label>
                                    <input type="number" class="form-control" id="cantidad" value="100" min="1" max="1000">
                                </div>
                                <div class="col-md-4">
                                    <label for="municipio" class="form-label">Municipio (Opcional)</label>
                                    <input type="text" class="form-control" id="municipio" placeholder="Ej: Junín">
                                </div>
                                <div class="col-md-4">
                                    <label for="geoProfile" class="form-label">Geo Profile (Opcional)</label>
                                    <input type="text" class="form-control" id="geoProfile" placeholder="Ej: junin">
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" id="btnGenerate">
                                    🌱 Generar Respuestas
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-dark text-white">
                        Logs de Ejecución
                    </div>
                    <div class="card-body p-0">
                        <div id="logArea">Esperando acción...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logArea = document.getElementById('logArea');
            const timestamp = new Date().toLocaleTimeString();
            let color = '#00ff00'; // info
            if (type === 'error') color = '#ff4444';
            if (type === 'warn') color = '#ffbb33';

            const line = `<div style="color: ${color}; margin-bottom: 4px;">[${timestamp}] ${msg}</div>`;
            logArea.innerHTML += line;
            logArea.scrollTop = logArea.scrollHeight;
        }

        document.getElementById('seedForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnGenerate');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Procesando...';
            document.getElementById('logArea').innerHTML = '';

            try {
                const apiUrlBase = document.getElementById('apiUrl').value.replace(/\/$/, '');
                const token = document.getElementById('authToken').value;
                const encuestaId = document.getElementById('encuestaId').value;
                const cantidad = parseInt(document.getElementById('cantidad').value);
                const municipio = document.getElementById('municipio').value;
                const geoProfile = document.getElementById('geoProfile').value;

                if (!encuestaId) {
                    throw new Error("El ID de encuesta es obligatorio.");
                }

                // Construct URL: {base}/{id}/seed-demo
                const url = `${apiUrlBase}/${encuestaId}/seed-demo`;

                log(`Iniciando request a: ${url}`);
                log(`Configuración: Cantidad=${cantidad}, Municipio=${municipio || 'Auto'}, Geo=${geoProfile || 'Auto'}`);

                const payload = {
                    cantidad: cantidad,
                    municipality_label: municipio || null,
                    geo_profile_key: geoProfile || null
                };

                const headers = {
                    'Content-Type': 'application/json'
                };

                if (token) {
                    headers['Authorization'] = token.startsWith('Bearer ') ? token : `Bearer ${token}`;
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                log('✅ ¡Éxito! Respuestas generadas correctamente.');
                log(`Detalles: ${JSON.stringify(data, null, 2)}`);

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Auto-fill token from localStorage if available (common in dev dashboards)
        window.addEventListener('DOMContentLoaded', () => {
            const storedToken = localStorage.getItem('auth_token') || localStorage.getItem('token');
            if (storedToken) {
                document.getElementById('authToken').value = storedToken;
                log('Token recuperado de localStorage', 'warn');
            }
        });
    </script>
</body>
</html>
